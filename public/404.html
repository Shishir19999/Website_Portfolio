<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Shishir Sharma Upadhyay</title>
    <link rel="icon" type="image/svg+xml" href="/Website_Portfolio/favicon.svg" />
    <style>
      :root { --bg: #f3eee1; --ink: #1c1b18; --muted: #4a463d; --accent: #c22f17; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1b1a16; --ink: #eee8d8; --muted: #bdb6a4; --accent: #ff7d5e; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 17px/1.6 Georgia, 'Times New Roman', serif; }
      main { max-width: 520px; }
      .code { font-size: clamp(5rem, 22vw, 9rem); font-weight: 900; line-height: 0.9; margin: 0; color: transparent; -webkit-text-stroke: 2px var(--ink); letter-spacing: -0.05em; }
      .stamp { display: inline-block; border: 3px double var(--accent); color: var(--accent); font: 600 1rem ui-monospace, Consolas, monospace; letter-spacing: 0.1em; padding: 0.4em 0.7em; transform: rotate(-6deg); margin: 14px 0; }
      h1 { margin: 8px 0; font-size: 1.7rem; }
      p { color: var(--muted); }
      a { display: inline-block; margin-top: 12px; padding: 12px 20px; border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); background: var(--accent); color: var(--bg); font: 600 0.85rem ui-monospace, Consolas, monospace; text-transform: uppercase; text-decoration: none; }
      a:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <span class="stamp" aria-hidden="true">TEST FAILED</span>
      <h1>This page could not be found</h1>
      <p>The link may be wrong, or the page moved. The portfolio home page has the rest: about, experience, skills, projects and QA work samples.</p>
      <a href="/Website_Portfolio/">Back to the portfolio</a>
    </main>
  </body>
</html>
