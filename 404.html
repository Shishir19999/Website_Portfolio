<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Shishir Sharma Upadhyay</title>
    <link rel="icon" type="image/svg+xml" href="/Website_Portfolio/favicon.svg" />
    <style>
      :root { --bg: #f7f3e3; --ink: #1d2247; --muted: #4c5273; --brand: #282f61; --brand-ink: #f7f3e3; }
      @media (prefers-color-scheme: dark) { :root { --bg: #11142b; --ink: #f3efdf; --muted: #bcc0da; --brand: #d4af6a; --brand-ink: #1a1f42; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; text-align: center; }
      main { max-width: 520px; }
      .code { font-size: clamp(4rem, 18vw, 7rem); font-weight: 800; line-height: 1; margin: 0; color: var(--brand); letter-spacing: -0.04em; }
      h1 { margin: 8px 0; font-size: 1.6rem; }
      p { color: var(--muted); }
      a { display: inline-block; margin-top: 12px; padding: 12px 22px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
